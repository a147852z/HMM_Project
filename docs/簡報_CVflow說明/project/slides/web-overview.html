<div class="card" style="padding:24px 28px;"><h3 style="font-size:32px;">右上：模型版本</h3><p class="body">每次訓練都會留下一個版本，標示「使用中」的是預測時用的那個。</p></div>

<aside>這裡的成績都來自訓練時刻意保留、沒有參與訓練的測試序列，所以是「沒看過的資料」上的表現。MRR 是實際答案排名倒數的平均，第一名得 1、第二名得 0.5，依此類推。</aside>
