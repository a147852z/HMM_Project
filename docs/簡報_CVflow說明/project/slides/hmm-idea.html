<aside>類比：只看得到一個人每天做了什麼（觀測），猜他背後的模式（狀態）。HMM 從大量序列中同時學出「每種模式會做什麼」和「模式之間怎麼切換」。學好之後，給它一段修改紀錄，它就能推估目前處於哪個狀態，並預測下一次修改。</aside>
