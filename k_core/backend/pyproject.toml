[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcore"
version = "0.1.0"
description = "K: HMM knowledge core for the intelligent distributed ERP research project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "hmmlearn>=0.3.3,<0.4",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "python-multipart>=0.0.9",
  "scipy>=1.11,<2",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
